<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="forestGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1F332A"/>
      <stop offset="100%" stop-color="#17251F"/>
    </linearGradient>
    <linearGradient id="terracottaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#CA7F62"/>
      <stop offset="100%" stop-color="#B86F52"/>
    </linearGradient>
    <linearGradient id="stoneGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EAE3D6"/>
      <stop offset="100%" stop-color="#D8CDBB"/>
    </linearGradient>
  </defs>

  <!-- Forest Rounded Shield Base -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#forestGrad)" stroke="#D8CDBB" stroke-width="2"/>
  
  <!-- Subtle Inner Border -->
  <rect x="10" y="10" width="108" height="108" rx="22" fill="none" stroke="#D8CDBB" stroke-opacity="0.25" stroke-width="1"/>

  <!-- Himalayan Mountain Peak in Terracotta -->
  <polygon points="64,24 88,60 40,60" fill="url(#terracottaGrad)"/>
  <polygon points="64,24 76,60 52,60" fill="#CA7F62" opacity="0.6"/>
  <!-- Mountain Snow Crest in Ivory -->
  <polygon points="64,24 71,36 67,34 64,37 60,34 57,36" fill="#F5F0E7"/>

  <!-- Architectural Foundation Plinth (Warm Stone) -->
  <rect x="28" y="96" width="72" height="6" rx="2" fill="url(#stoneGrad)"/>
  <rect x="32" y="92" width="64" height="3" rx="1.5" fill="#EAE3D6"/>

  <!-- Classical Architectural Pillars (Stability & Integrity) -->
  <!-- Left Pillar -->
  <rect x="34" y="58" width="10" height="32" rx="2" fill="url(#stoneGrad)"/>
  <!-- Middle-Left Pillar -->
  <rect x="49" y="52" width="10" height="38" rx="2" fill="url(#stoneGrad)"/>
  <!-- Middle-Right Pillar -->
  <rect x="69" y="52" width="10" height="38" rx="2" fill="url(#stoneGrad)"/>
  <!-- Right Pillar -->
  <rect x="84" y="58" width="10" height="32" rx="2" fill="url(#stoneGrad)"/>

  <!-- Architrave / Entablature Beam across Pillars -->
  <rect x="30" y="48" width="68" height="4" rx="1" fill="#F5F0E7"/>
  <!-- Terracotta Accent Dot in Pediment -->
  <circle cx="64" cy="42" r="3" fill="#B86F52"/>
</svg>